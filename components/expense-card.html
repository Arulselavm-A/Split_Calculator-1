<section class="panel folder-panel expense-panel">
  <div class="folder-header">
    <span class="folder-badge">Expense</span>
    <h2>Add expense</h2>
  </div>

  <form id="expenseForm">
    <div class="field-grid two-col">
      <div>
        <label class="field-label" for="expenseTitle">What was spent?</label>
        <input id="expenseTitle" class="text-input" type="text" placeholder="Petrol, food, hotel..." required />
      </div>

      <div>
        <label class="field-label" for="expenseAmount">Amount</label>
        <input id="expenseAmount" class="text-input" type="number" min="0" step="0.01" placeholder="0.00" required />
      </div>
    </div>

    <div class="field-grid two-col">
      <div>
        <label class="field-label" for="expensePayer">Paid by</label>
        <select id="expensePayer" class="select-input"></select>
      </div>

      <div>
        <label class="field-label" for="splitMode">Split mode</label>
        <select id="splitMode" class="select-input">
          <option value="selected">Selected members</option>
          <option value="all">All members</option>
        </select>
      </div>
    </div>

    <div class="split-block">
      <div class="split-toolbar">
        <label class="field-label">Split for</label>
        <div class="split-actions">
          <button id="selectAllMembers" class="mini-btn" type="button">All</button>
          <button id="clearSelectedMembers" class="mini-btn muted" type="button">Clear</button>
        </div>
      </div>
      <div id="selectedSplitSummary" class="split-summary">Selected: all members</div>
      <div id="memberSplitList" class="split-list"></div>
    </div>

    <button class="primary-btn full-width" type="submit">Add expense</button>
  </form>
</section>
